# Geheimnis-Scan mit gitleaks (getestet mit 8.30.1).
# Aufruf aus dem Wurzelordner, damit Pfade relativ sind:
#   gitleaks dir . --config .gitleaks.toml --redact
#
# Standardregeln plus genau eine Ausnahme: erfundene Test-Attrappen unter
# tests/, deren Wert einen Marker trägt (synth, test, geheim, GEHEIM,
# platzhalter). condition = "AND" verlangt Pfad UND Marker; ohne AND würde
# die Ausnahme ganz tests/ freistellen.
# targetRules nennt alle Standardregeln von gitleaks 8.30.1: eine globale
# Ausnahme mit paths überspringt in gitleaks sonst die ganze Datei, ohne die
# Bedingung AND zu beachten. Regeln späterer Versionen fallen nicht unter die
# Ausnahme und melden auch Attrappen (im Zweifel ein Fund zu viel).

[extend]
useDefault = true

[[allowlists]]
description = "Erfundene Test-Attrappen unter tests/ mit Marker im Wert"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/''']
regexes = ['''(?:synth|test|geheim|GEHEIM|platzhalter)''']
targetRules = [
  "1password-secret-key",
  "1password-service-account-token",
  "adafruit-api-key",
